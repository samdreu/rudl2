[package]
name = "copper-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
copper-core = { version = "0.1.0", path = "../copper-core" }
copper-analysis = { version = "0.1.0", path = "../copper-analysis" }
env_logger = "0.11.8"
log = "0.4.29"
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0.114", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
trybuild = "1.0.114"
copper-sim = { version = "0.1.0", path = "../copper-sim" }
