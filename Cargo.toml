[workspace]
resolver = "3"
members = ["copper-core", "copper-analysis", "copper-macros", "copper-codegen", "copper-sim"]

[package]
name = "copper"
version = "0.1.0"
edition = "2024"

[dependencies]
copper-core = { path = "copper-core" }
copper-macros = { path = "copper-macros" }
copper-codegen = { path = "copper-codegen" }
copper-sim = { path = "copper-sim" }
env_logger = "0.11.8"
log = "0.4.29"

[dev-dependencies]
# The shared control/liveness analysis — the equivalence harness uses it to
# structurally reg-match inferred registers against independent hand-written SV
# (G2 of design_docs/SYNCHRONOUS_SEMANTICS_IMPL_PLAN.md).
copper-analysis = { path = "copper-analysis" }

