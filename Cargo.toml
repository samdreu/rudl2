[workspace]
resolver = "3"
members = ["copper-core", "copper-macros", "copper-codegen", "copper-sim"]

[package]
name = "copper"
version = "0.1.0"
edition = "2024"

[dependencies]
copper-core = { path = "copper-core" }
copper-macros = { path = "copper-macros" }
copper-codegen = { path = "copper-codegen" }
copper-sim = { path = "copper-sim" }
env_logger = "0.11.8"
log = "0.4.29"

[[example]]
name = "one_bit_comparator"
path = "examples/combinational/one_bit_comparator.rs"

[[example]]
name = "mux"
path = "examples/combinational/mux.rs"

[[example]]
name = "ripple_carry_adder"
path = "examples/combinational/ripple_carry_adder.rs"

[[example]]
name = "rotate_right"
path = "examples/combinational/rotate_right.rs"

[[example]]
name = "priority_encode"
path = "examples/combinational/priority_encode.rs"

[[example]]
name = "shift_register"
path = "examples/sequential/shift_register.rs"
