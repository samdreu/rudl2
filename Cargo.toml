[workspace]
resolver = "3"
members = ["copper-core", "copper-analysis", "copper-macros", "copper-codegen", "copper-sim"]

[package]
name = "copper"
version = "0.1.0"
edition = "2024"
description = "Copper: a Rust-embedded HDL — hardware as #[hardware] async fns, simulated and transpiled to SystemVerilog"

[dependencies]
copper-core = { path = "copper-core" }
copper-macros = { path = "copper-macros" }
copper-codegen = { path = "copper-codegen" }
copper-sim = { path = "copper-sim" }
env_logger = "0.11.8"
log = "0.4.29"

[build-dependencies]
# `build.rs` generates one differential equivalence test per `#[hardware]` module in
# tests/fixtures/ (phase 2 of design_docs/CORPUS_DIFFERENTIAL_SWEEP.md), which means
# parsing their signatures — the same `syn` the rest of the pipeline reads.
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"

[dev-dependencies]
# The shared control/liveness analysis — the equivalence harness uses it to
# structurally reg-match inferred registers against independent hand-written SV
# (G2 of design_docs/SYNCHRONOUS_SEMANTICS_IMPL_PLAN.md).
copper-analysis = { path = "copper-analysis" }
# `tests/cdc_synchronizer_anchor.rs` parses a fixture to call `infer_registers`
# directly (pinning the synchronizer register-inference gap).
syn = { version = "2", features = ["full", "parsing"] }

